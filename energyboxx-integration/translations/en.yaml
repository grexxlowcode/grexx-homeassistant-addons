configuration:
  energyboxx_mqtt_username:
    name: Energyboxx username
    description: Your Energyboxx broker username.
  energyboxx_mqtt_password:
    name: Energyboxx password
    description: Your Energyboxx broker password.
  community_topic:
    name: Community topic
    description: MQTT topic pattern to subscribe to (default community/#).
  flip_power_result_kw:
    name: Flip power result (kW)
    description: Multiply sensor.power_result_kw by -1 so import/export sign matches Home Assistant convention.
