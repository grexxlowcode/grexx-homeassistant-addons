configuration:
  energyboxx_mqtt_username:
    name: Energyboxx-gebruikersnaam
    description: Je gebruikersnaam voor de Energyboxx-broker.
  energyboxx_mqtt_password:
    name: Energyboxx-wachtwoord
    description: Je wachtwoord voor de Energyboxx-broker.
  community_topic:
    name: Community-topic
    description: MQTT-topicpatroon waarop wordt geabonneerd (standaard community/#).
  flip_power_result_kw:
    name: Vermogensresultaat omkeren (kW)
    description: Vermenigvuldig sensor.power_result_kw met -1 zodat het teken voor import/export overeenkomt met de Home Assistant-conventie.
