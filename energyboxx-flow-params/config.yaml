name: "Energyboxx Flow Params"
description: "Shows your Energyboxx community's live power flow and prices in Home Assistant"
version: "1.4.0"
slug: "energyboxx"
init: false
homeassistant: "2024.11.0"
arch:
  - aarch64
  - amd64
boot: auto
options:
  energyboxx_mqtt_username: ""
  energyboxx_mqtt_password: ""
  community_topic: "community/#"
  flip_power_result_kw: true
schema:
  energyboxx_mqtt_username: str
  energyboxx_mqtt_password: password
  community_topic: str
  flip_power_result_kw: bool
  log_level: list(debug|info|warning|error)?
logs: true
homeassistant_api: true
hassio_api: true
hassio_role: default
startup: system
