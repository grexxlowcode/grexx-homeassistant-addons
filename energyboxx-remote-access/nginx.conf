# Template: run.sh fills in the placeholders and writes it to /etc/nginx/http.d.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 127.0.0.1:8099;
  # Resolve per request so the add-on starts even while Home Assistant restarts.
  resolver __RESOLVER__ valid=30s;
  set $upstream __UPSTREAM__;
  client_max_body_size 0;
  access_log off;
  error_log /dev/stderr warn;

  location / {
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # Home Assistant answers 400 to forwarded headers unless the user configures trusted_proxies.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Real-IP "";
    proxy_buffering off;
    # Only used when Home Assistant itself serves HTTPS, with its own (often self-signed) certificate.
    proxy_ssl_verify off;
    proxy_read_timeout 1d;
  }
}
