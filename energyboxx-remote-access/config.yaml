name: "Energyboxx Remote Access"
description: "Lets Energyboxx support open your Home Assistant without exposing it to the internet"
version: "0.1.0"
slug: "energyboxx_remote_access"
init: false
homeassistant: "2024.11.0"
arch:
  - aarch64
  - amd64
boot: manual
startup: application
options:
  access_code: ""
schema:
  access_code: password
  log_level: list(debug|info|warning|error)?
homeassistant_api: true
hassio_api: true
